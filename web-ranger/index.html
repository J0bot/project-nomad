<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0f1c">
<title>Ranger — ploxion</title>
<style>
  :root{ --bg:#0a0f1c; --pan:#101830; --ink:#dfe9ff; --dim:#5b6b8c; --line:#21304e; --acc:#7fd0ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; overscroll-behavior:none; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:10px; padding:max(10px,env(safe-area-inset-top)) 14px 10px;
    border-bottom:1px solid var(--line); background:rgba(10,15,28,.8); backdrop-filter:blur(10px); }
  header b{ font-size:17px; letter-spacing:.5px; } header small{ color:var(--dim); font-size:11px; }
  header .sp{ flex:1; }
  .ic{ background:var(--pan); border:1px solid var(--line); color:var(--ink); border-radius:11px; padding:8px 11px; font-size:14px; }
  #boxes{ flex:1; overflow-y:auto; padding:12px 12px 120px; -webkit-overflow-scrolling:touch; }
  .box{ background:var(--pan); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; overflow:hidden;
    border-left:4px solid var(--bc,#7fd0ff); }
  .box.drop{ outline:2px dashed var(--acc); outline-offset:-3px; }
  .bh{ display:flex; align-items:center; gap:9px; padding:11px 13px; }
  .bh .em{ font-size:20px; }
  .bh .nm{ flex:1; font-weight:700; }
  .bh .ct{ color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .bh .cog{ color:var(--dim); padding:4px 8px; }
  .grid{ display:flex; flex-wrap:wrap; gap:8px; padding:0 13px 13px; min-height:8px; }
  .box.collapsed .grid{ display:none; }
  .item{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    width:84px; min-height:84px; padding:9px 7px; background:#0c1426; border:1px solid var(--line); border-radius:13px;
    text-align:center; transition:transform .1s; }
  .item:active{ transform:scale(.95); }
  .item.sel{ border-color:var(--acc); box-shadow:0 0 0 2px rgba(127,208,255,.5) inset; }
  .item .ie{ font-size:24px; line-height:1; }
  .item img{ width:54px; height:54px; object-fit:cover; border-radius:8px; }
  .item .it{ font-size:11px; color:var(--ink); max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty{ color:var(--dim); font-size:12px; padding:2px 0 10px; font-style:italic; }
  /* barre de rangement (item sélectionné) */
  #movebar{ position:fixed; left:0; right:0; bottom:0; z-index:30; transform:translateY(120%); transition:transform .25s;
    background:rgba(8,12,24,.96); border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  #movebar.on{ transform:translateY(0); }
  #movebar .lbl{ color:var(--dim); font-size:12px; margin-bottom:8px; }
  #chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .chip{ flex:0 0 auto; background:var(--pan); border:1px solid var(--line); border-radius:11px; padding:9px 13px; font-size:13px;
    border-left:4px solid var(--bc,#7fd0ff); }
  /* compose */
  #bar{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; gap:8px; align-items:center;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid var(--line);
    background:rgba(10,15,28,.92); backdrop-filter:blur(10px); }
  #bar.hide{ display:none; }
  #emoji{ width:46px; height:46px; flex:0 0 auto; border-radius:50%; background:var(--pan); border:1px solid var(--line); font-size:22px; }
  #truc{ flex:1; background:var(--pan); color:var(--ink); border:1px solid var(--line); border-radius:23px; padding:12px 16px; font:inherit; }
  #addbtn{ width:46px; height:46px; flex:0 0 auto; border-radius:50%; border:none; font-size:22px; font-weight:800;
    background:linear-gradient(180deg,#7fd0ff,#2f8fd8); color:#06223a; }
  #photo{ width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:var(--pan);border:1px solid var(--line);font-size:20px; }
  #toast{ position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:40; background:#10182c; border:1px solid var(--line);
    border-radius:11px; padding:9px 14px; font-size:13px; opacity:0; transition:opacity .3s; max-width:88%; text-align:center; }
  #toast.show{ opacity:1; }
  .hidden{ display:none!important; }
  dialog{ background:var(--pan); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:16px; width:min(330px,86vw); }
  dialog::backdrop{ background:rgba(0,0,0,.6); }
  dialog input{ width:100%; background:#0c1426; color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:11px; font:inherit; margin:6px 0; }
  dialog .row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  dialog .sw{ width:30px; height:30px; border-radius:50%; border:2px solid transparent; }
  dialog .sw.on{ border-color:#fff; }
  .btn{ border:none; border-radius:11px; padding:11px 16px; font:700 14px/1 inherit; background:linear-gradient(180deg,#7fd0ff,#2f8fd8); color:#06223a; }
  .btn.g{ background:var(--pan); color:var(--ink); border:1px solid var(--line); }
  .btn.d{ background:#2a1020; color:#ff9bb3; border:1px solid #3a1422; }
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Ranger</b><small id="sub">tes trucs</small><span class="sp"></span>
    <button class="ic" id="addBox" title="nouvelle boîte">＋ boîte</button>
  </header>
  <div id="boxes"></div>
  <div id="bar">
    <button id="emoji" title="emoji">🟦</button>
    <button id="photo" title="photo">📷</button>
    <input id="truc" placeholder="un truc à ranger…">
    <button id="addbtn" title="ajouter">＋</button>
  </div>
  <div id="movebar"><div class="lbl">ranger « <span id="movename"></span> » dans :</div><div id="chips"></div></div>
</div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" class="hidden">
<dialog id="boxdlg">
  <h3 id="bdTitle" style="margin:0 0 6px">Boîte</h3>
  <input id="bdName" placeholder="nom de la boîte" maxlength="24">
  <input id="bdEmoji" placeholder="emoji (ex 📦)" maxlength="4">
  <div class="row" id="bdColors"></div>
  <div class="row" style="justify-content:space-between;margin-top:14px">
    <button class="btn d" id="bdDel">supprimer</button>
    <span><button class="btn g" id="bdCancel">annuler</button> <button class="btn" id="bdOk">ok</button></span>
  </div>
</dialog>
<script>
"use strict";
const $=s=>document.querySelector(s);
const COLORS=['#7fd0ff','#ff85a8','#9be15d','#ffd166','#c792ea','#ff9d3c','#5ad1ff','#8d99ae'];
const EMOJIS=['🟦','💡','✅','📌','🎵','📷','🔗','🧩','🌀','⭐','🔥','🧠','📦','🪐','🗺️','❤️','🎮','🛠️','📝','⚡'];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2200);}
let S; try{ S=JSON.parse(localStorage.getItem('ranger.v1')); }catch(e){ S=null; }
if(!S||!S.boxes){ S={ boxes:[
  {id:1,name:'À ranger',emoji:'📥',color:'#8d99ae'},
  {id:2,name:'Idées',emoji:'💡',color:'#ffd166'},
  {id:3,name:'À faire',emoji:'✅',color:'#9be15d'},
  {id:4,name:'Plus tard',emoji:'🌀',color:'#c792ea'},
], items:[], nb:5, ni:1 }; }
const save=()=>localStorage.setItem('ranger.v1', JSON.stringify(S));
let pendingEmoji=EMOJIS[0], sel=null;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  const wrap=$('#boxes'); wrap.innerHTML='';
  let total=0;
  for(const b of S.boxes){
    const items=S.items.filter(i=>i.boxId===b.id); total+=items.length;
    const box=document.createElement('div'); box.className='box'+(b.collapsed?' collapsed':''); box.style.setProperty('--bc',b.color); box.dataset.box=b.id;
    const h=document.createElement('div'); h.className='bh';
    h.innerHTML='<span class="em">'+(b.emoji||'📦')+'</span><span class="nm">'+esc(b.name)+'</span><span class="ct">'+items.length+'</span><span class="cog">⚙︎</span>';
    h.querySelector('.nm').onclick=()=>{ b.collapsed=!b.collapsed; save(); render(); };
    h.querySelector('.em').onclick=()=>{ b.collapsed=!b.collapsed; save(); render(); };
    h.querySelector('.cog').onclick=(e)=>{ e.stopPropagation(); editBox(b); };
    // drop desktop
    box.ondragover=e=>{ e.preventDefault(); box.classList.add('drop'); };
    box.ondragleave=()=>box.classList.remove('drop');
    box.ondrop=e=>{ e.preventDefault(); box.classList.remove('drop'); const id=+e.dataTransfer.getData('id'); moveItem(id,b.id); };
    box.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    if(!items.length){ const em=document.createElement('div'); em.className='empty'; em.textContent='vide'; grid.appendChild(em); }
    for(const it of items){
      const el=document.createElement('div'); el.className='item'+(sel&&sel.id===it.id?' sel':''); el.draggable=true; el.dataset.id=it.id;
      el.innerHTML=(it.img?'<img src="'+it.img+'">':'<span class="ie">'+(it.emoji||'🟦')+'</span>')+'<span class="it">'+esc(it.text||'')+'</span>';
      el.onclick=()=>selectItem(it);
      el.ondragstart=e=>{ e.dataTransfer.setData('id',it.id); };
      el.ondblclick=()=>editItem(it);
      // appui long = editer (mobile)
      let lt; el.ontouchstart=()=>{ lt=setTimeout(()=>editItem(it),550); };
      el.ontouchend=()=>clearTimeout(lt); el.ontouchmove=()=>clearTimeout(lt);
      grid.appendChild(el);
    }
    box.appendChild(grid); wrap.appendChild(box);
  }
  $('#sub').textContent=total+' trucs · '+S.boxes.length+' boîtes';
}
function addItem(){
  const t=$('#truc').value.trim(); if(!t && pendingEmoji===null) return;
  let url=null; const m=t.match(/https?:\/\/\S+/); if(m) url=m[0];
  S.items.unshift({id:S.ni++, boxId:S.boxes[0].id, text:t, emoji:pendingEmoji, url, t:Date.now()});
  $('#truc').value=''; save(); render(); toast('rangé dans « '+S.boxes[0].name+' »');
}
function addPhoto(dataURL){ S.items.unshift({id:S.ni++, boxId:S.boxes[0].id, text:$('#truc').value.trim(), img:dataURL, t:Date.now()}); $('#truc').value=''; save(); render(); toast('photo ajoutée'); }
function moveItem(id,boxId){ const it=S.items.find(i=>i.id===id); if(!it) return; it.boxId=boxId; sel=null; save(); render(); closeMove();
  const b=S.boxes.find(x=>x.id===boxId); toast('rangé dans « '+(b?b.name:'?')+' »'); }
function selectItem(it){ if(sel&&sel.id===it.id){ sel=null; closeMove(); render(); return; } sel=it; openMove(it); render(); }
function openMove(it){ $('#movename').textContent=(it.text||'truc').slice(0,22); const c=$('#chips'); c.innerHTML='';
  for(const b of S.boxes){ if(b.id===it.boxId) continue; const ch=document.createElement('button'); ch.className='chip'; ch.style.setProperty('--bc',b.color);
    ch.textContent=(b.emoji||'📦')+' '+b.name; ch.onclick=()=>moveItem(it.id,b.id); c.appendChild(ch); }
  $('#movebar').classList.add('on'); $('#bar').classList.add('hide'); }
function closeMove(){ $('#movebar').classList.remove('on'); $('#bar').classList.remove('hide'); sel=null; }

// --- boîtes : créer / éditer ---
let editing=null;
function editBox(b){ editing=b||null;
  $('#bdTitle').textContent=b?'Modifier la boîte':'Nouvelle boîte';
  $('#bdName').value=b?b.name:''; $('#bdEmoji').value=b?b.emoji:'📦';
  $('#bdDel').style.display=b?'inline-block':'none';
  const cw=$('#bdColors'); cw.innerHTML=''; const cur=b?b.color:COLORS[0];
  for(const col of COLORS){ const sw=document.createElement('button'); sw.className='sw'+(col===cur?' on':''); sw.style.background=col;
    sw.onclick=()=>{ cw.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); sw.classList.add('on'); sw.dataset.on='1'; cw._c=col; };
    if(col===cur) cw._c=col; cw.appendChild(sw); }
  $('#boxdlg').showModal();
}
$('#bdOk').onclick=()=>{ const name=$('#bdName').value.trim()||'Boîte'; const emoji=$('#bdEmoji').value.trim()||'📦'; const color=$('#bdColors')._c||COLORS[0];
  if(editing){ editing.name=name; editing.emoji=emoji; editing.color=color; } else { S.boxes.push({id:S.nb++,name,emoji,color}); }
  save(); render(); $('#boxdlg').close(); };
$('#bdCancel').onclick=()=>$('#boxdlg').close();
$('#bdDel').onclick=()=>{ if(!editing) return; if(S.items.some(i=>i.boxId===editing.id)){ if(!confirm('Cette boîte contient des trucs — ils repartent dans « À ranger ». Supprimer ?')) return; S.items.forEach(i=>{ if(i.boxId===editing.id) i.boxId=S.boxes[0].id; }); }
  S.boxes=S.boxes.filter(b=>b.id!==editing.id); save(); render(); $('#boxdlg').close(); };

// --- items : éditer / supprimer ---
function editItem(it){ const t=prompt('Le truc :', it.text||''); if(t===null) return;
  if(t.trim()==='' && !it.img){ if(confirm('Supprimer ce truc ?')){ S.items=S.items.filter(x=>x.id!==it.id); } }
  else it.text=t.trim(); sel=null; closeMove(); save(); render(); }

// --- wiring ---
$('#addbtn').onclick=addItem;
$('#truc').addEventListener('keydown',e=>{ if(e.key==='Enter') addItem(); });
$('#emoji').onclick=()=>{ const i=(EMOJIS.indexOf(pendingEmoji)+1)%EMOJIS.length; pendingEmoji=EMOJIS[i]; $('#emoji').textContent=pendingEmoji; };
$('#photo').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); const s=Math.min(1,360/Math.max(img.width,img.height));
    c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); addPhoto(c.toDataURL('image/jpeg',0.8)); };
    img.src=r.result; }; r.readAsDataURL(f); e.target.value=''; };
$('#addBox').onclick=()=>editBox(null);
$('#emoji').textContent=pendingEmoji;
render();
</script>
</body>
</html>
