<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit UI · ton interface</title>
<style>
  *, *::before, *::after { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:#070a0f; color:rgba(228,234,244,.92);
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:.84rem;
    -webkit-text-size-adjust:100%;
  }
  .eu { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; background:#0a0c12; }
  .eu__bar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid rgba(120,160,230,.2); flex-wrap:wrap; }
  .eu__t { font-weight:700; color:rgba(150,200,255,.95); }
  .eu__t b { color:#fff; }
  .eu__pre { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .eu__pb { cursor:pointer; font-size:.66rem; padding:3px 10px; border-radius:20px; font-family:inherit; border:1px solid rgba(120,160,230,.35); background:rgba(30,40,70,.5); color:rgba(200,215,245,.95); }
  .eu__pb:hover { background:rgba(50,65,110,.6); color:#fff; }
  .eu__list { flex:1; min-height:0; overflow-y:auto; padding:8px 12px; -webkit-overflow-scrolling:touch; }
  .eu__row { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid rgba(120,160,230,.08); }
  .eu__lab { flex:1; }
  .eu__lab .d { font-size:.66rem; color:rgba(170,185,220,.6); }
  .eu__sw { position:relative; flex:0 0 auto; width:42px; height:23px; border-radius:14px; cursor:pointer; background:rgba(90,100,130,.4); transition:background .15s; border:1px solid rgba(255,255,255,.08); }
  .eu__sw::after { content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:left .15s; }
  .eu__sw.on { background:rgba(90,200,140,.85); } .eu__sw.on::after { left:21px; }
  .eu__slider { padding:11px 2px; border-bottom:1px solid rgba(120,160,230,.08); }
  .eu__slider input { width:100%; }
  .eu__foot { flex:0 0 auto; padding:7px 12px; border-top:1px solid rgba(120,160,230,.14); font-size:.64rem; color:rgba(170,185,220,.6); }
</style>
</head>
<body>
<div class="eu">
  <div class="eu__bar">
    <span class="eu__t">&#127979; <b>Edit UI</b> &middot; ton interface</span>
    <span class="eu__pre">
      <button class="eu__pb" data-pre="zen">&#129496; &eacute;pur&eacute;</button>
      <button class="eu__pb" data-pre="all">tout afficher</button>
    </span>
  </div>
  <div class="eu__list"></div>
  <div class="eu__foot">Masque ce qui te g&ecirc;ne &mdash; c&rsquo;est gard&eacute; entre les pages, et diffus&eacute; sur le bus pour le bureau-fen&ecirc;tres.</div>
</div>

<script>
(function () {
  // chaque toggle masque un élément quand ACTIVÉ (on = masqué).
  var TOGGLES = [
    { k:'neural',    n:'Fond neuronal',         d:'l’animation qui bouge derrière' },
    { k:'dock',      n:'Dock',                  d:'la barre de ploxions en bas' },
    { k:'fab',       n:'Bouton ploxions (FAB)', d:'le rond flottant qui ouvre le launcher' },
    { k:'theme',     n:'Bouton thème',     d:'le switch de thème flottant' },
    { k:'identity',  n:'Bouton identité',  d:'le switch d’identité flottant' },
    { k:'quickbar',  n:'Barre rapide',          d:'la barre de restauration' },
    { k:'dashboard', n:'Dashboard',             d:'le panneau d’accueil' },
    { k:'footer',    n:'Footer',                d:'le pied de page' }
  ];

  function prefs() { try { return JSON.parse(localStorage.getItem('xb:ui') || '{}'); } catch (e) { return {}; } }
  function save(p) { try { localStorage.setItem('xb:ui', JSON.stringify(p)); } catch (e) {} }

  // bus same-origin : émet les prefs pour qu'un host (bureau-fenêtres) les applique.
  var es = null;
  function emit(topic, payload) {
    try {
      fetch('/emit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic, payload: payload }),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  function broadcast(p) { emit('edit-ui.prefs', p); }

  var list = document.querySelector('.eu__list');
  var p = prefs();

  function render() {
    list.innerHTML = TOGGLES.map(function (t) {
      return '<div class="eu__row"><div class="eu__lab">' + t.n + '<div class="d">' + t.d + '</div></div>'
           + '<div class="eu__sw' + (p[t.k] ? ' on' : '') + '" data-k="' + t.k + '" title="masquer"></div></div>';
    }).join('')
    + '<div class="eu__slider"><div style="margin-bottom:6px">Opacité du fond neuronal</div>'
    + '<input type="range" min="0" max="100" value="' + (p.__neop != null ? Math.round(p.__neop * 100) : 100) + '" data-neop></div>';
  }
  render();
  broadcast(p);

  list.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-k]'); if (!sw) return;
    var k = sw.getAttribute('data-k'); p[k] = !p[k]; sw.classList.toggle('on', p[k]); save(p); broadcast(p);
  });
  list.addEventListener('input', function (e) {
    var s = e.target.closest('[data-neop]'); if (!s) return;
    var v = +s.value / 100; if (v >= 1) delete p.__neop; else p.__neop = v; save(p); broadcast(p);
  });

  document.querySelector('.eu__pre').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pre]'); if (!b) return;
    if (b.getAttribute('data-pre') === 'zen') {
      var pos = p.__pos; p = { neural:true, dashboard:true, footer:true, quickbar:true }; if (pos) p.__pos = pos;
    } else {
      p = {};
    }
    save(p); broadcast(p); render();
  });

  // reçoit les prefs d'un autre client (autre onglet / host) et se resynchronise.
  function listen() {
    try {
      es = new EventSource('/events');
      es.addEventListener('edit-ui.prefs', function (ev) {
        try {
          var np = JSON.parse(ev.data);
          if (np && typeof np === 'object') { p = np; save(p); render(); }
        } catch (e) {}
      });
    } catch (e) { es = null; }
  }
  listen();

  // DROIT AU SILENCE : on coupe le flux et on libère tout quand la page part.
  function silence() {
    if (es) { try { es.close(); } catch (e) {} es = null; }
  }
  window.addEventListener('pagehide', silence);
  window.addEventListener('beforeunload', silence);
})();
</script>
</body>
</html>
