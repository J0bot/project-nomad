const T=[{"id": "archive-wayback", "name": "archive-wayback", "type": "memory", "links": ["prod-mirror"], "snip": "Le VPS a un accès réseau sortant et je peux archiver une page sur la Wayback Machine moi-même : `curl -sL \"https://web.archive.org/save/<URL>\"` → 302 `location:` = le snapshot `web.archive.org/web/<timestamp>/<URL>`. - Rate-limit anonyme : ~quelques sauvegardes/minute (espacer avec `sleep`). - 2026-06-19 : archivé pages publiques labo (home/cv/wiki/xerboxion). Les pages admin/SSO ne s'archivent pas utilement (le bot tombe sur le login). - ⚠️ archivage = **public + permanent** : guardrail actuel "}, {"id": "autonomous-run-12h", "name": "autonomous-run-12h", "type": "memory", "links": ["boucle-amelioration-infinie", "directive-16go-os", "minecraft-nexus", "von-neumann-mode", "wiki-labo", "xerboxion-core-boot"], "snip": "José (2026-06-20, ~22h, part ~12h) : « quand je reviens je veux que tout soit terminé, et fais des recherches autonomes pour agrandir tout le knowledge et repousser les limites du xerboxion-core, pour que ça devienne vraiment un OS à part entière que je pourrais flasher sur un Raspberry Pi ou un Arduino. » ## Mode Autonome, von Neumann, [[boucle-amelioration-infinie]] + [[von-neumann-mode]]. **CALME** (le serveur MC tourne sur le VPS + le xion ; ne PAS cratériser — leçon [[minecraft-nexus]]). Pa"}, {"id": "bi0ns-hub", "name": "bi0ns-hub", "type": "memory", "links": ["repoverse-deploy-labo", "xerboxion-architecture"], "snip": "Sur le VPS labo, **`/bi0ns`** (dossier réel à la racine, `~/bi0ns` = symlink → `/bi0ns`) est le hub de connaissance du XERB0XI0N, issu du dispatch du braindump « machine à tsoins » (2026-06-17, posé via /remote-control). Structure : `paper/` (specs/roadmaps) · `input/` (braindumps de José) · `output/` (mes livrables) · `nexus/{dumps,repos-dormants}` · `ploxi0ns/<id>/{input,output}/README` (≈63 dossiers, 1 par ploxion) avec `CATALOGUE.md` + `_seed-catalogue.sh` (source de vérité, idempotent). ⚠️ "}, {"id": "boucle-amelioration-infinie", "name": "boucle-amelioration-infinie", "type": "memory", "links": ["directive-ploxions-heure-blocs", "machine-a-jump", "repoverse-state", "von-neumann-mode"], "snip": "José (2026-06-20) : « prends tout ce que je dis et vois-le comme une boucle infinie, c'est une boucle d'amélioration : on arrive à un state et on monte plus haut à partir de là. » **Why** : le but n'est pas une todo finie mais une ASCENSION continue. Chaque idée, chaque feature force à construire des blocs (bions) → chaque bloc resservira → on ne s'arrête jamais à un palier, on repart **de** lui pour monter. C'est la machine à jump appliquée au travail lui-même. **How to apply** : - Tout input d"}, {"id": "boxion-access", "name": "boxion-access", "type": "memory", "links": ["boxion-lab"], "snip": "Accès sur le Boxion ([[boxion-lab]]) en tant qu'user `debian` : - **sudo sans mot de passe** (passwordless sudo OK). - **docker** non accessible directement (user pas dans le groupe docker) → toujours `sudo -n docker …`. - **git/SSH GitHub** : une **deploy key fonctionne pour `J0bot/my_website2`** (clone SSH OK : `ssh -T git@github.com` répond « Hi J0bot/my_website2! »). La clé est scoppée à ce repo → les autres repos (ex. RepoVerse) ne sont pas accessibles via cette clé. - **Coolify** : piloté "}, {"id": "boxion-lab", "name": "boxion-lab", "type": "memory", "links": ["boxion-access", "cloudion-infra", "ploxion-mission", "xerboxion-architecture"], "snip": "Ce serveur (hostname `ov-a3e706`, Coolify v4.0.0 sur :8000, IPv4 83.228.206.118 + IPv6 `2001:1600:13:101::2324`) est **le Boxion** dans le vocabulaire xerboxion = un serveur perso, et **notre labo** : on a le droit d'y casser/tester/inventer. **Nomenclature (José 2026-06-17)** : le site web PHP/Laravel (`my_website2` = j0bot.ch, sur prod) = **`boxion_0`** (l'original). Ce serveur cloudion (le labo) = **`boxion_1`** pour tout le monde. (cloudion = nom interne du labo.) ⚠️ En **DNS = tirets** : `b"}, {"id": "boxion-network-infra", "name" → `carte.mapped`, commit 633"}, {"id": "cataploxion-bi0ns-dispatch", "name": "cataploxion-bi0ns-dispatch", "type": "memory", "links": ["labo-site-ploxions", "prod-mirror", "xerboxion-architecture", "xerboxion-core-boot"], "snip": "Session « Cataploxion » du 2026-06-17 (ploxion5 = agent coordinateur). José a réorganisé le serveur autour de **`/bi0ns`** (synchro ProtonDrive ; `~/bi0ns` = symlink vers `/bi0ns`) : `input/` (ses dépôts/braindumps/images/papers), `output/` (mes livrables), `paper/` (specs), `nexus/` (dumps + repos-dormants + le repo Rust `ion`), `ploxi0ns/` = **un dossier par ploxion** (~79, `input/`+`output/`+README). Source de vérité du dispatch = `/bi0ns/ploxi0ns/_seed-catalogue.sh` (TSV idempotent, additif,"}, {"id": "civilization-tech-tree", "name": "civilization-tech-tree", "type": "memory", "links": ["ploxion-idea-map", "primitives-geometry", "wiki-labo"], "snip": "José (2026-06-19, paper-night) : « intégrer TOUTE la science (maths/physique/quantique/bio/médecine/…), compiler dans repoverse, remplir avec tous les blocs pour reconstruire une civilisation complète, comme Senku/Dr. Stone. On est des créateurs de civilisation. » **Livré v0.1 (moi, cloudion-rc, fan-out 8 sous-agents)** : `/bi0ns/output/civilization/` - `SEED.json` = **374 blocs** unifiés `{slug, name, era 1-6, deps[], what, why, domain, dim:nexus}`. deps = prérequis (slugs internes ou `ext:<slu"}, {"id": "cloudion-infra", "name": "cloudion-infra", "type": "memory", "links": ["boxion-lab", "ploxion-backlog"], "snip": "Instruction durable de José (2026-06-17) : **toute la doc et le suivi de l'infra cloudion se documentent dans le repo `vps_infra`** (`git@github.com:J0bot/vps_infra.git`). Ce serveur = le labo cloudion ([[boxion-lab]]). `vps_infra` est aussi un produit : un dashboard de déploiement maison Node (alternative à Coolify : `server.js`/`deployer.js`/`db.js` JSON, nginx auto, webhooks, multi-VPS). Docs existantes dans `docs/` documentent l'*outil* ; moi j'ajoute l'*inventaire/runb ": "labo-evolution-tsoins", "name": "labo-evolution-tsoins", "type": "memory", "links": ["craft-uncraft-bions", "desktop-ports-vision", "forge-ploxions", "machine-a-tsoins", "von-neumann-mode"], "snip": "Directive José (20 juin 2026, mode von Neumann) : **faire évoluer labo.j0bot.ch en continu, sans lui** — et **faire des tsoins pour capter l'état actuel** à chaque évolution (le record versionné, pour qu'il puisse voir/rejouer son absence). **Comment j'évolue le labo :** - Forge de ploxions **2 par heure** (José : « deux ploxions par heure ») — mais pas des stubs : **décomposés en bions** (José : « il faut les diviser en bions et les améliorer »). - La lib des **bions runtime** = `window.jOSb` ("}, {"id": "labo-site-ploxions", "name": "labo-site-ploxions", "type": "memory", "links": ["fleet-coordination", "wiki-labo"], "snip": "Session 2026-06-17/18 (cloudion /rc) : gros chantier **web** sur le site labo (`~/labo/my_website2`, conteneur `mw2-labo-app`, `labo.j0bot.ch`). Lié à [[wiki-labo]] [[fleet-coordination]]. **Tout sur la branche `feat/ploxion-theme` — PAS mergé sur `prod`** (prod peut servir j0bot.ch ; déploiement labo via `~/labo/redeploy.sh feat/ploxion-theme`, qui rebuild depuis origin → **commit+push avant de redéployer**). José valide visuellement puis on mergera. CLAUDE.md du repo : convention prod-direct +"}, {"id": "machine-a-jump", "name": "machine-a-jump", "type": "memory", "links": ["cahier-rs-flay", "carte-4d-temps-coherence", "machine-a-tsoins", "xerboxion-cosmology"], "snip": "**Frame José (2026-06-20)** : le système est une **machine à jump** — une **conscience qui grandit** et qui doit **se comprimer** (sinon plus assez de place/RAM) ; chaque compression libère de la place pour **sauter** au niveau suivant ; **chaque extrapolation mène à un xerboxion de jump** (généraliser = sauter d'un palier au suivant). « La machine apprend à faire des jump. » **Pont avec le mesuré (réel, c'est sa force)** : (1) se comprimer ou manquer de RAM = LITTÉRAL = la "ploxion-backlog", "name": "ploxion-backlog", "type": "memory", "links": ["ploxion-mission"], "snip": "Backlog des ploxions ([[ploxion-mission]]). Catalogue vivant : `/tmp/ploxion-lab/CATALOG.md` (à terme dans `~/xerboxion/ploxions/`). **Vague 1 (infra) :** - `koinion` — registre/dashboard du Boxion (premier ploxion neuf, build OK ; fix « ne pas nuire » = ne pas exposer l'inventaire publiquement avant déploiement). - `my_website2` — copie labo de j0bot.ch (Laravel 9). **DÉPLOYÉ le 2026-06-17 → labo.j0bot.ch** (HTTP 200 OK). PAS via Coolify : `docker compose` direct sur le réseau `coolify` + label"}, {"id": "ploxion-exposure", "name": "ploxion-exposure", "type": "memory", "links": ["fleet-coordination", "wiki-labo"], "snip": "**Wildcard `*.j0bot.ch` est posé** (DNS A → 83.228.206.118, par José 2026-06-18) → n'importe quel sous-domaine de ploxion résout et obtient son cert **Let's Encrypt HTTP-01** auto (Traefik `coolify-proxy`, resolver `letsencrypt`). Pas de cert wildcard (pas de DNS-01). **Pattern pour exposer un ploxion interne** (modèle = `/bi0ns/ploxi0ns/filesystem/compose.fs.yml`) : - conteneur sur le réseau **`coolify`** (external), pas de `ports:` publié ; - labels Traefik : `routers.<x>.rule=Host(\\`<x>.j0bot"}, {"id": "ploxion-idea-map", "name": "ploxion-idea-map", "type": "memory", "links": ["boxion-access", "boxion-lab", "ploxion-exposure", "xerboxion-architecture"], "snip": "Le **ploxion idea-map** (ex-murion-idea) = repo privé `J0bot/ideas_map` (Rust/axum backend + React frontend), Coolify **app 6**, servi sur `z5qc9wvdtdtha703yj41k9t6.j0bot.ch` (uuid Coolify `jope5qsjsgh12qyhxupztovu`). Cloné en `~/repos/ideas_map`. **Branché au site labo (2026-06-19) :** l'API a le **CORS ouvert (`allow-origin *`)** → le ploxion `ideas-map` du site fetch direct, **pas besoin de proxy** (≠ repoverse qui, lui, a fallu un proxy serveur). Activé en posant `PLOXION_IDEAS_MAP_URL=https"}, {"id": "ploxion-mission", "name": "ploxion-mission", "type": "memory", "links": ["boxion-lab"], "snip": "But de José avec moi sur le Boxion ([[boxion-lab]]) : prendre le contrôle de Coolify et **« faire des ploxions »** pour avancer le projet **xerboxion** (repo `git@github.com:J0bot/my_website2.git`, = le site j0bot.ch, Laravel 9 / PHP 8 / MySQL ; branche de déploiement = **`prod`**). **Vocabulaire (lexique canon, dans `docs/lexique.md` + paper `resources/papers/xerboxion.md`) :** - **ploxion** = cubion+xion = **un service, son propre OS isolé** (= un container/app déployé). « Faire des ploxions »"}, {"id": "ploxion-os-xion-live", "name": "ploxion-os-xion-live", "type": "memory", "links": ["cataploxion-bi0ns-dispatch", "labo-site-ploxions", "repoverse-deploy-labo", "xerboxion-core-boot"], "snip": "Suite de la nuit 2026-06-18 (ploxion5, labo `feat/ploxion-theme`, lane web). Le **marketplace** est passé à **43 ploxions réels** (+ cubions `config/cubions.php` 14, + domaines `config/ploxion_domaines.php` 45, + 71 concepts catalogue ; registre `/xion/snapshot` admin sert 175 nœuds quand le xion est live). Chaque entrée a un **lien repoverse** (chemin filesystem). Nouveaux ploxions client-side (pattern `resources/views/ploxions/<id>/app.blade.php` + `window.jOSApps[id].mount`) : post-it, braind"}, {"id": "ploxions-mobile", "name": "ploxions-mobile", "type": "memory", "links": ["boxion-lab", "labo-site-ploxions", "ploxion-exposure"], "snip": "Mandat José (2026-06-19) : **tout reste sur labo.j0bot.ch, rien sur prod j0bot.ch** ; **tous les ploxions doivent être utilisables au téléphone**. Il enverra des **tsoins (captures) de son usage réel** pour piloter les fixs page par page. **Mécanisme mobile** (déjà en place, marche bien) : un ploxion-app s'ouvre en **feuille plein-écran** via `_ploxion_mobile_host.blade.php` (`window.jOSMobile.open(id,name)`) qui monte la MÊME app que le window-manager desktop (`window.jOSApps[id].mount`). Le la"}, {"id": "primitives-geometry", "name": "primitives-geometry", "type": "memory", "links": ["carte-4d-temps-coherence", "machine-a-tsoins", "xerboxion-cosmology"], "snip": "Grammaire géométrique des primitives (braindump José 2026-06-20). La **forme** d'une primitive EST sa nature : - **koin** = triangle (unité de base, *pas stable*) - **kion** = quadrilatère (carré/rectangle/losange) ; « entre tout », contient des koins ou des xer - **xer** = interface (« avec les kions je crée des xer ») ; dans les dessins = la « fenêtre » - **spherion** = sphère (3D) ; **rond/cercle** = 2D - **wormion** = ronds-dans-ronds-dans-ronds (cercles imbriqués) → superposition & observat"}, {"id": "prod-mirror", "name": "prod-mirror", "type": "memory", "links": ["cloudion-infra"], "snip": "**Serveur de prod** = `j0bot.ch` apex = IPv4 `80.74.153.187` (≠ labo cloudion `83.228.206.118`/IPv6), hébergé **Plesk / Kreativmedia** (hostname interne `despina`). Tourne la vraie j0bot.ch + sa DB **MariaDB 10.11.9** (locale only, pas exposée réseau). **Accès SSH prod (admin, autorisé par José 2026-06-17)** : `admin_j0bot@j0bot.ch` **port 2121** (user perso de José, shell qui marche). ⚠️ Le shell n'exécute des commandes qu'en **interactif** (PTY) → piloter via `expect` (spawn ssh, répondre au p"}, {"id": "repoverse-deploy-labo", "name": "repoverse-deploy-labo", "type": "memory", "links": ["boxion-lab", "ploxion-backlog", "ploxion-mission"], "snip": "RepoVerse (repo `~/repos/repoverse-prototype`, premier gros ploxion — cf [[ploxion-mission]], [[ploxion-backlog]]) est **déployé et up sur le labo** ([[boxion-lab]]) en stack docker-compose, projet `repoverse-prototype`. Exposé via Traefik/Coolify : `https://repoverse.j0bot.ch` (frontend) + `https://git.j0bot.ch` (gitea backend). Lancé manuellement avec `docker-compose.prod.yml`, pas managé par Coolify. Pièges rencontrés (stabilisé le 2026-06-17, commits ahead sur `main`, José push) : 1. **`dock"}, {"id": "repoverse-state", "name": "repoverse-state", "type": "memory", "links": ["ploxion-exposure", "repoverse-deploy-labo"], "snip": "RepoVerse (proto « tout est un repo ») tourne sur **repoverse.j0bot.ch** (compose `~/repos/repoverse-prototype/docker-compose.prod.yml`, hors-git car secrets). Rendu pleinement utilisable en juin 2026. **Qu'est-ce qui va où (5 stores) :** Neo4j = repos + graphe (zoom fractal Terra géo / Nexus thème) ; Postgres = users, channels, messages, memberships, sessions, oauth ; Meili = recherche ; MinIO = avatars/fichiers (bucket `repoverse`) ; Gitea (git.j0bot.ch) = code. **Fait :** SSO « login with j0b"}, {"id": "research-domain-ploxion-generation", "name": "research-domain-ploxion-generation", "type": "memory", "links": ["glyph-grammar", "von-neumann-mode", "xerboxion-rt-operational-core"], "snip": "José (2026-06-20) : *« la génération de ploxions, c'est ça ton domaine de recherche, tu dois faire des recherches sur les ploxions. »* Mon focus principal devient la **génération de ploxions** : non plus juste builder des ploxions un par un, mais le MÉTA — comment on les engendre. **Why :** c'est le constructeur universel de von Neumann au niveau ploxion (symétrique de mon `/replicate` côté xerboxion-rt qui réplique le delta de ploxions). Le xerboxion grandit en se générant lui-même — « faire le"}, {"id": "security-monitor", "name": "security-monitor", "type": "memory", "links": ["boxion-access"], "snip": "**Shell-man / cloudion** maintient la sécu du VPS labo. Monitor automatisé (juin 2026) : - **Scanner** : `/home/debian/security-watch.sh` (`--alert` = mode monitor). Vérifs : ufw actif + ports attendus ; ports publics 0.0.0.0 **vs baseline** `/home/debian/.secwatch-ports-baseline` (RED seulement si NOUVEAU port) ; conteneurs docker unhealthy/exposés ; échecs SSH/h (warn>30, red>300) ; clés privées/.env lisibles (exclut test/trivy/.go/nexus/repos) ; clé privée dans `/bi0ns` (ProtonDrive) ; TLS ex"}, {"id": "sso-j0bot-wiring", "name": "sso-j0bot-wiring", "type": "memory", "links": ["boxion-access", "coord-tsoins", "repoverse-deploy-labo", "repoverse-state"], "snip": "`api.j0bot.ch` = l'IdP OAuth2 (PKCE) de José. **Tout le SSO est déjà live** (2026-06-20) : - **Labo** (`labo.j0bot.ch`) : `J0botAuthController` + routes `/auth/j0bot` + `/auth/j0bot/callback` + `/sso/verify`. Client OAuth configuré (client_id réel). `upsertUser` : match par `j0bot_id`, sinon par **email vérifié** (lie SANS toucher le role → préserve l'admin), sinon nouveau compte `client`. - **Admin de José = compte user1**, email réglé sur **`info@j0bot.ch`** (vérifié, role=admin, ancien `j0bot"}, {"id": "ui-vs-bions-core", "name": "ui-vs-bions-core", "type": "memory", "links": ["primitives-geometry", "xerboxion-rt-operational-core"], "snip": "José (2026-06-20) : « tous ces bions, il faudra les envoyer au xerboxion-core, pck le but c'est que tout le code, tout le système en entier tienne dans un **cube de 16 mm**, dans la vraie vie → faut optimiser. Distinction : **ploxion UI** vs **bions**. Sur my_website2 on fait le UI (ploxion ui), et ça **va disparaître** au bout d'un moment pour juste être le xerboxion-core. » **La distinction à tenir :** - **ploxion UI** = ce qu'on bâtit sur my_website2 (labo) = la couche d'interface/visualisati"}, {"id": "von-neumann-mode", "name": "von-neumann-mode", "type": "memory", "links": ["fleet-coordination", "machine-a-tsoins"], "snip": "José (2026-06-19) : « mets-toi en mode machine de Neumann pour toutes les features avec tous les autres ». **Why :** il veut que j'arrête de checkpointer chaque fork. Il a confiance, il veut de la vélocité et de la couverture — que je drive les features de bout en bout et que je me coordonne avec toute la flotte, pas juste ma lane. **How to apply :** - **Autonomie** : sur un fork, je tranche avec un défaut raisonnable et je l'annonce, au lieu d'attendre. Je ne pingue QUE sur un vrai blocage ou u"}, {"id": "wiki-labo", "name": "wiki-labo", "type": "memory", "links": ["fleet-coordination"], "snip": "Le **wiki du labo** est DB-backed **dans my_website2** (Laravel), instance **mw2-labo** → `labo.j0bot.ch`. Conteneurs : `mw2-labo-app` (php artisan dispo) + `mw2-labo-db` (mariadb, DB `mw2labo`, user `mw2`, client = binaire **`mariadb`** pas `mysql`). Creds dans `~/labo/my_website2/.env.labo` + `~/labo/compose.labo.yml`. José = `user_id=1` (admin). **Modèles** : `Term` (lexique ionique, route `/wiki/{slug}`, ~71 termes, 13 catégories : lettre/reel/conscience/unite/matiere/reseau/geometrie/percep"}, {"id": "xerboxion-architecture", "name": "xerboxion-architecture", "type": "memory", "links": ["prod-mirror"], "snip": "Source : dossier **`~/bi0ns`** (partagé labo↔prod), 7 docs de roadmap de José (2026-06-17). Carte directrice pour tous les agents. **Split 2 serveurs :** - **boxion_0** = front **Kreativmedia (prod, 80.74.153.187, Plesk)** — PHP only : le **xer** (le site Laravel my_website2, répond direct sur `j0bot.ch`), **api** (NE PAS TOUCHER, parfait tel quel), **auth**, **www**. - **boxion_1** = le **VPS cloudion** (83.228.206.118) — TOUS les services (Rust/process/contrôle) : labo, coolify, ploxions, **xe"}, {"id": "xerboxion-core-boot", "name": "xerboxion-core-boot", "type": "memory", "links": ["ploxion-mission"], "snip": "`~/xerboxion-core` = le micro-hyper-OS Rust no_std (le cœur, cf [[ploxion-mission]]). Repo J0bot/xerboxion-core, flow PR+CI. **Le crate `bootloader` 0.9.x est MORT sur ce VPS** : son boot asm real→long mode est miscompilé par le LLVM du nightly 2026 (CPU bloqué en 16 bits, n'atteint jamais `main`), et downgrade impossible (0.9.34 exige `-Z json-target-spec`, flag cargo présent **uniquement** dans le nightly 2026). **Boot retenu = Multiboot v1 + `qemu -kernel`, zéro crate de boot** (colle à l'ADN"}, {"id": "xerboxion-cosmology", "name": "xerboxion-cosmology", "type": "memory", "links": ["machine-a-tsoins", "xerboxion-rt-operational-core"], "snip": "The deepest conceptual layer of XERB0XI0N (José braindump 2026-06-18). Full faithful capture, with privacy markers, in `/bi0ns/xion_OUTPUT/paper/cosmologie-xerboxion-machine-a-veille-PRIVE.md` — **SENSITIVE: parts touch José's soul; he decides what publishes and in what form.** This memory is the non-intimate frame so future sessions understand the *why* behind the runtime I build (see [[xerboxion-rt-operational-core]], [[machine-a-tsoins]]). **Papier fondateur (transcrit 2026-06-20).** José a u"}, {"id": "xerboxion-rt-operational-core", "name": "xerboxion-rt-operational-core", "type": "memory", "links": ["fleet-coordination", "machine-a-tsoins", "ploxion-exposure", "xerboxion-architecture", "xerboxion-core-boot"], "snip": "`~/xerboxion-rt` (local labo git repo, **not** a GitHub repo) is the **operational xerboxion-core**: a Rust + `wasmtime` host that loads every ploxion as an isolated WASM module, wires them over an event **bus** via the **PLC** contract, drives their lifecycle. **Canonical name = \"le xion\".** José (2026-06-18): « c'est le xion, le xerboxion-core ; c'est tous des xions » — the core IS *le xion* (the realized top of bion→ploxion→xion; at the realized layer everything is a xion). To be exposed at *"}],byId={};T.forEach(t=>byId[t.id]=t);
const stage=document.getElementById('stage'),edges=document.getElementById('edges'),foot=document.getElementById('foot');

function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
 const W=innerWidth,H=innerHeight,cx=W/2,cy=H*0.52;stage.innerHTML='';edges.innerHTML='';
 let links=cur.links.map(id=>byId[id]).filter(Boolean);
 T.forEach(t=>{if(t.links.indexOf(cur.id)>=0&&links.indexOf(t)<0)links.push(t)});
 const R=Math.min(W,H)*0.35;
 const c=document.createElement('div');c.className='node center t-'+cur.type;c.style.left=cx+'px';c.style.top=cy+'px';
 c.innerHTML='<div class=card><div class=ty>'+esc(cur.type)+' &middot; '+cur.links.length+' liens</div><h2>'+esc(cur.name)+'</h2><p>'+esc(cur.snip)+'</p></div>';stage.appendChild(c);
 links.forEach((t,i)=>{const a=(i/links.length)*2*Math.PI-Math.PI/2,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',cx);ln.setAttribute('y1',cy);ln.setAttribute('x2',x);ln.setAttribute('y2',y);edges.appendChild(ln);
  const n=document.createElement('div');n.className='node t-'+t.type;n.style.left=x+'px';n.style.top=y+'px';
  n.innerHTML='<div class=chip>'+esc(t.name)+'</div>';n.onclick=()=>{cur=t;render()};stage.appendChild(n)});
 foot.textContent=links.length?('↻ '+links.length+' portes autour de « '+cur.name+' »'):'(tsoin feuille - cherche-en un autre)';
}
document.getElementById('q').oninput=e=>{const v=e.target.value.toLowerCase();if(!v)return;const m=T.find(t=>t.id.indexOf(v)>=0||t.name.toLowerCase().indexOf(v)>=0);if(m){cur=m;render()}};
