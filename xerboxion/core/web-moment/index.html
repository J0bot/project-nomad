<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moment — capter l'instant</title>
<!-- PL0XION moment, migré du Laravel vers xerboxion-core : page standalone, zéro
     dépendance serveur. Un tap capte le NOW (heure, ce qui joue, thème, ta note) et
     le scelle comme un tsoin addressable. Le flux = ta timeline d'instants. 100% local
     (clé localStorage xb:moments). Émet sur le bus same-origin (/emit, /events). -->
<style>
    html,body{margin:0;height:100%}
    body{background:#070a0f}
    .mo{display:flex;flex-direction:column;height:100vh;background:#0a0d10;color:#e9eef4;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.84rem}
    .mo__top{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 14px;border-bottom:1px solid rgba(110,200,180,.16)}
    .mo__now{font-size:clamp(30px,9vmin,52px);font-weight:800;font-variant-numeric:tabular-nums;color:#5eead4;line-height:1}
    .mo__date{font-size:.74rem;color:rgba(180,220,210,.6)}
    .mo__ctx{font-size:.72rem;color:rgba(180,215,205,.7);text-align:center;min-height:1.1em}
    .mo__note{width:100%;max-width:420px;box-sizing:border-box;background:rgba(0,0,0,.3);border:1px solid rgba(110,200,180,.25);border-radius:9px;color:#dffaf0;padding:8px 10px;font:0.84rem ui-sans-serif,system-ui;outline:none}
    .mo__cap{cursor:pointer;border:0;border-radius:24px;background:#5eead4;color:#06231c;font-weight:800;font-size:.95rem;padding:11px 28px}
    .mo__cap:hover{filter:brightness(1.08)}
    .mo__list{flex:1;min-height:0;overflow-y:auto;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
    .mo__m{border:1px solid rgba(110,200,180,.16);border-radius:11px;padding:9px 11px;background:rgba(255,255,255,.02)}
    .mo__mh{display:flex;align-items:baseline;gap:8px;font-size:.7rem;color:rgba(180,215,205,.6)}
    .mo__mt{color:#5eead4;font-weight:700;font-variant-numeric:tabular-nums}
    .mo__sp{flex:1}
    .mo__del{cursor:pointer;border:0;background:none;color:rgba(255,150,150,.55);font-size:.7rem}
    .mo__mn{margin-top:5px;font-size:.9rem;line-height:1.4;white-space:pre-wrap;word-break:break-word}
    .mo__mc{margin-top:4px;font-size:.66rem;color:rgba(170,205,195,.6)}
    .mo__empty{text-align:center;color:rgba(180,210,200,.5);padding:22px;font-size:.84rem;line-height:1.5}
    .mo__toast{position:fixed;left:50%;top:46px;transform:translateX(-50%);z-index:40;padding:6px 13px;border-radius:18px;font-size:.74rem;color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 22px rgba(0,0,0,.5);background:rgba(20,80,60,.96);transition:opacity .4s}
</style>
</head>
<body>
<div class="mo">
    <div class="mo__top">
        <div><div class="mo__now" data-now>--:--</div><div class="mo__date" data-date></div></div>
        <div class="mo__ctx" data-ctx></div>
        <input class="mo__note" data-note placeholder="une note sur cet instant (optionnel)…">
        <button class="mo__cap" data-cap>⧗ capter l'instant</button>
    </div>
    <div class="mo__list" data-list></div>
</div>
<script>
(function () {
    'use strict';

    // --- bions inlinés (esc + store), factorisés du runtime jOSb d'origine ---
    function esc(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
    function store(key){
        return {
            get:function(def){ try{ var v=localStorage.getItem(key); return v==null?def:JSON.parse(v); }catch(e){ return def; } },
            set:function(v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }
        };
    }

    // --- bus same-origin (la page est servie à /px/moment/index.html) ---
    function emit(topic, payload){
        try{
            fetch('/emit',{ method:'POST', headers:{'Content-Type':'application/json'},
                body:JSON.stringify({ topic:topic, payload:payload }) }).catch(function(){});
        }catch(e){}
    }
    // état "ce qui joue", alimenté par le bus si le mixer émet des events sound.*
    var bus = { sound:'' };
    var es = null;
    try{
        es = new EventSource('/events');
        es.onmessage = function(ev){
            try{
                var d = JSON.parse(ev.data);
                var t = d.topic || '';
                if (t === 'sound.now' || t === 'sound.playing' || t.indexOf('sound') === 0) {
                    var p = d.payload || {};
                    if (typeof p === 'string') { bus.sound = p; }
                    else if (p.label || p.kind || p.icon) { bus.sound = (p.icon || '🔊') + ' ' + (p.label || p.kind || ''); }
                    else if (p.playing === false || p.paused === true) { bus.sound = ''; }
                }
            }catch(e){}
        };
    }catch(e){ es = null; }

    // --- état ---
    var st = store('xb:moments');
    var moments = st.get([]) || [];
    var clk = null;

    var elNow  = document.querySelector('[data-now]');
    var elDate = document.querySelector('[data-date]');
    var elCtx  = document.querySelector('[data-ctx]');
    var elNote = document.querySelector('[data-note]');
    var list   = document.querySelector('[data-list]');

    function sound(){ return bus.sound || ''; }
    function theme(){ try{ return document.documentElement.getAttribute('data-theme') || ''; }catch(e){ return ''; } }

    function clock(){
        var d = new Date();
        elNow.textContent  = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
        elDate.textContent = d.toLocaleDateString('fr-FR',{ weekday:'long', day:'numeric', month:'long' });
        var s = sound(); elCtx.textContent = s ? ('♪ '+s) : 'silence';
    }
    function fmtT(ts){ var d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
    function fmtD(ts){ try{ return new Date(ts).toLocaleDateString('fr-FR',{ day:'2-digit', month:'short' }); }catch(e){ return ''; } }

    function render(){
        if (!moments.length){
            list.innerHTML = '<div class="mo__empty">aucun moment capté.<br>Tape « capter l\'instant » — chaque instant devient un tsoin, posé dans ta timeline.</div>';
            return;
        }
        list.innerHTML = moments.slice().reverse().map(function(m){
            return '<div class="mo__m" data-id="'+m.id+'"><div class="mo__mh"><span class="mo__mt">'+fmtT(m.at)+'</span><span>'+fmtD(m.at)+'</span><span class="mo__sp"></span><button class="mo__del" data-del="'+m.id+'">✕</button></div>'
                + (m.note ? '<div class="mo__mn">'+esc(m.note)+'</div>' : '')
                + '<div class="mo__mc">'+esc([m.sound ? '♪ '+m.sound : '', m.theme ? '◐ '+m.theme : ''].filter(Boolean).join(' · ') || '— instant nu')+'</div></div>';
        }).join('');
        list.querySelectorAll('[data-del]').forEach(function(b){
            b.addEventListener('click', function(){
                moments = moments.filter(function(x){ return x.id !== b.getAttribute('data-del'); });
                st.set(moments); render();
            });
        });
    }

    function toast(msg){
        var t = document.createElement('div'); t.className = 'mo__toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.remove(); }, 400); }, 1600);
    }

    function capture(){
        var m = { id:'m'+Date.now().toString(36), at:Date.now(), note:elNote.value.trim(), sound:sound(), theme:theme() };
        moments.push(m); st.set(moments.slice(-200)); moments = st.get([]); elNote.value = '';
        emit('moment.captured', m);   // scelle l'instant comme tsoin addressable sur le bus
        toast('⧗ instant capté');
        render();
    }

    document.querySelector('[data-cap]').addEventListener('click', capture);
    elNote.addEventListener('keydown', function(e){ if (e.key === 'Enter') capture(); });

    clock(); render(); clk = setInterval(clock, 1000);

    // --- droit au silence : la page disparaît → on coupe tout ---
    function silence(){
        if (clk !== null){ clearInterval(clk); clk = null; }
        if (es){ try{ es.close(); }catch(e){} es = null; }
    }
    window.addEventListener('pagehide', silence);
    window.addEventListener('beforeunload', silence);
})();
</script>
</body>
</html>
