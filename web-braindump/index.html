<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧠 Braindump</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background:#070a0f; }

    /* le body EST le ploxion : la racine .bdp remplit la fenêtre */
    .bdp { display:flex; flex-direction:column; height:100%; min-height:100dvh; background:#06090d;
        color:rgba(220,232,240,.92); font-family:ui-sans-serif,system-ui,sans-serif; }
    .bdp__bar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:7px 11px;
        border-bottom:1px solid rgba(120,160,230,.18); }
    .bdp__t { font-weight:700; letter-spacing:.04em; color:rgba(160,195,255,.95); font-size:.82rem; }
    .bdp__sp { flex:1; }
    .bdp__cnt { font-size:.7rem; color:rgba(150,180,220,.6); font-family:ui-monospace,monospace; }
    .bdp__btn { cursor:pointer; padding:3px 9px; border-radius:6px; border:1px solid rgba(120,160,230,.3);
        background:none; color:rgba(160,195,255,.85); font-size:.72rem; }
    .bdp__btn:hover { background:rgba(120,160,230,.12); color:#fff; }
    .bdp__stream { flex:1; min-height:0; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column-reverse; gap:7px; }
    .bdp__e { border-left:2px solid rgba(120,160,230,.35); padding:3px 0 3px 10px; }
    .bdp__e:hover .bdp__del { opacity:1; }
    .bdp__meta { font-size:.62rem; color:rgba(150,180,220,.5); font-family:ui-monospace,monospace; display:flex; gap:8px; }
    .bdp__del { margin-left:auto; cursor:pointer; opacity:0; border:0; background:none; color:rgba(255,140,140,.8); font-size:.62rem; }
    .bdp__txt { font-size:.84rem; line-height:1.4; white-space:pre-wrap; word-break:break-word; color:rgba(224,236,244,.95); }
    .bdp__in { flex:0 0 auto; display:flex; gap:8px; padding:9px 11px; border-top:1px solid rgba(120,160,230,.18); }
    .bdp__field { flex:1; resize:none; min-height:40px; max-height:140px; border-radius:8px; padding:8px 10px;
        border:1px solid rgba(120,160,230,.25); background:rgba(18,26,42,.55); color:#fff; font-family:inherit; font-size:.84rem; outline:none; }
    .bdp__field:focus { border-color:rgba(120,160,230,.55); }
    .bdp__send { align-self:stretch; }
    .bdp__empty { margin:auto; color:rgba(190,212,228,.4); font-size:.82rem; }
</style>
</head>
<body>
<div class="bdp">
    <div class="bdp__bar"><span class="bdp__t">🧠 Braindump</span><span class="bdp__sp"></span>
        <span class="bdp__cnt"></span><button class="bdp__btn" data-export>export</button></div>
    <div class="bdp__stream"></div>
    <div class="bdp__in"><textarea class="bdp__field" placeholder="déverse… (Entrée = poser · Maj+Entrée = saut de ligne)"></textarea>
        <button class="bdp__btn bdp__send" data-send>poser</button></div>
</div>
<script>
(function () {
    var KEY = 'xb:braindump';
    function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    function stamp(t) { var d = new Date(t); function p(n){return (n<10?'0':'')+n;}
        return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes()); }

    // état pour le droit au silence
    var items = load();
    var focusTimer = null;
    var liveBlobUrl = null;

    var root   = document.querySelector('.bdp');
    var stream = root.querySelector('.bdp__stream');
    var field  = root.querySelector('.bdp__field');
    var cnt    = root.querySelector('.bdp__cnt');

    function refresh() {
        cnt.textContent = items.length + ' pensée' + (items.length > 1 ? 's' : '');
        stream.innerHTML = '';
        if (!items.length) { stream.innerHTML = '<div class="bdp__empty">le flux est vide — déverse en bas</div>'; return; }
        items.forEach(function (it) {
            var e = document.createElement('div'); e.className = 'bdp__e';
            var meta = document.createElement('div'); meta.className = 'bdp__meta';
            meta.innerHTML = '<span>' + stamp(it.t) + '</span>';
            var del = document.createElement('button'); del.className = 'bdp__del'; del.textContent = 'suppr';
            del.addEventListener('click', function () {
                items = items.filter(function (m) { return m.id !== it.id; }); save(items); refresh();
            });
            meta.appendChild(del);
            var tx = document.createElement('div'); tx.className = 'bdp__txt'; tx.textContent = it.txt;
            e.appendChild(meta); e.appendChild(tx); stream.appendChild(e);
        });
    }
    function add() {
        var v = field.value.trim(); if (!v) return;
        items.unshift({ id: 'b' + Date.now().toString(36), t: Date.now(), txt: v });
        save(items); field.value = ''; refresh();
    }

    field.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); add(); }
    });
    root.querySelector('[data-send]').addEventListener('click', add);
    root.querySelector('[data-export]').addEventListener('click', function () {
        var txt = items.slice().reverse().map(function (it) { return '[' + stamp(it.t) + '] ' + it.txt; }).join('\n\n');
        var a = document.createElement('a');
        // on garde l'URL pour pouvoir la révoquer au silence si le clic est interrompu
        if (liveBlobUrl) { URL.revokeObjectURL(liveBlobUrl); }
        liveBlobUrl = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
        a.href = liveBlobUrl;
        a.download = 'braindump.txt'; a.click();
        URL.revokeObjectURL(liveBlobUrl); liveBlobUrl = null;
    });

    refresh();
    focusTimer = setTimeout(function () { field.focus(); }, 30);

    // DROIT AU SILENCE : on coupe tout proprement quand la page se retire.
    function silence() {
        if (focusTimer) { clearTimeout(focusTimer); focusTimer = null; }
        if (liveBlobUrl) { URL.revokeObjectURL(liveBlobUrl); liveBlobUrl = null; }
    }
    window.addEventListener('pagehide', silence);
    window.addEventListener('beforeunload', silence);
})();
</script>
</body>
</html>
