<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xerboxion — la page Turing complète (interprète + compilateur wasm)</title>
<style>
  :root { --bg:#0b0e13; --fg:#cfe3ff; --dim:#5a7596; --acc:#46e0c0; --warn:#e0a046; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:14px 18px; border-bottom:1px solid #1b2433; }
  header b { color:var(--acc); }
  header span { color:var(--dim); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 18px; }
  @media(max-width:820px){ main{grid-template-columns:1fr;} }
  textarea { width:100%; height:150px; background:#070a0e; color:var(--fg); border:1px solid #1b2433; border-radius:8px; padding:10px; font:13px/1.5 ui-monospace,monospace; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  button { background:#11202b; color:var(--acc); border:1px solid #244; border-radius:8px; padding:8px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#16303f; }
  select { background:#070a0e; color:var(--fg); border:1px solid #1b2433; border-radius:8px; padding:6px; font:inherit; }
  pre { background:#070a0e; border:1px solid #1b2433; border-radius:8px; padding:10px; min-height:60px; white-space:pre-wrap; word-break:break-word; margin:0; }
  label { color:var(--dim); display:block; margin:6px 0 2px; }
  .ok { color:var(--acc); } .err { color:#e06060; } .info { color:var(--dim); }
  code { color:var(--warn); }
</style>
</head>
<body>
<header>
  <b>xerboxion · page Turing complète</b> &nbsp; <span>un interprète ET un compilateur WASM, directement sur la page — zéro serveur. Brainfuck (le plus petit langage Turing-complet) → wasm dans ton navigateur.</span>
</header>
<main>
  <section>
    <label>SOURCE (Brainfuck — Turing complet)</label>
    <textarea id="src">++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.</textarea>
    <div class="row">
      <select id="ex">
        <option value="">— exemples —</option>
        <option value="++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.">Hello World!</option>
        <option value=",[.,]">echo (relit l'entrée)</option>
        <option value="++++++++++[>+++++++>++++++++++>+++>+<<<<-]>++.>+.+++++++..+++.>++.<<+++++++++++++++.>.+++.------.--------.>+.>.">Hello World! (variante)</option>
      </select>
      <label style="display:inline">entrée :</label>
      <input id="in" value="xion" style="background:#070a0e;color:var(--fg);border:1px solid #1b2433;border-radius:8px;padding:6px;font:inherit;width:120px">
    </div>
    <div class="row">
      <button onclick="doInterp()">▶ Interpréter</button>
      <button onclick="doCompile()">⚙ Compiler → WASM &amp; lancer</button>
    </div>
  </section>
  <section>
    <label>SORTIE</label>
    <pre id="out"><span class="info">…</span></pre>
    <label>MODULE WASM produit (sur la page)</label>
    <pre id="wasm"><span class="info">compile pour voir les octets…</span></pre>
  </section>
</main>
<script src="bf-wasm.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('ex').onchange = e => { if (e.target.value) $('src').value = e.target.value; };
  function doInterp() {
    const out = $('out');
    try { const r = BFWasm.interpBF($('src').value, $('in').value); out.innerHTML = '<span class="ok">[interprété] </span>' + esc(r); }
    catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }
  async function doCompile() {
    const out = $('out'), wd = $('wasm');
    try {
      const bytes = BFWasm.compileBF($('src').value);
      wd.innerHTML = '<span class="ok">' + bytes.length + ' octets</span> · magic ' + [...bytes.slice(0,4)].join(' ') +
        '<br><span class="info">' + hex(bytes) + '</span>';
      const r = await BFWasm.runWasm(bytes, $('in').value);
      out.innerHTML = '<span class="ok">[compilé→wasm→exécuté] </span>' + esc(r);
    } catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }
  function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function hex(b){ return [...b].map(x=>x.toString(16).padStart(2,'0')).join(' ').replace(/((?:\S\S ){16})/g,'$1\n'); }
</script>
</body>
</html>
