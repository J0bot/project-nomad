<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🎁 Cadeau</title>
<!--
  PL0XI0N cadeau — ta WISHLIST (José : « tous les trucs que t'as envie d'acheter,
  ça se connecte avec finance, tu input combien t'as de thune »). Ajoute des
  envies (nom, prix, lien), pose ton budget → il te dit ce que tu peux te payer.
  « Au fur et à mesure », pas de paramétrage. localStorage (clé xb:cadeau).

  Standalone xerboxion-rt : le body EST le ploxion (plus de mount/container).
  Bus xion same-origin (/emit, /events) servi à /px/cadeau/index.html.
  Droit au silence sur pagehide/beforeunload (close EventSource).
-->
<style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background:#070a0f; }

    /* le body EST le ploxion : la racine .cd remplit la fenêtre */
    .cd { display:flex; flex-direction:column; height:100%; min-height:100dvh; background:#06090d;
        color:rgba(220,232,240,.92); font-family:ui-sans-serif,system-ui,sans-serif; font-size:.84rem; }
    .cd__bar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 11px; border-bottom:1px solid rgba(120,160,230,.18); flex-wrap:wrap; }
    .cd__t { font-weight:700; letter-spacing:.04em; color:rgba(255,160,200,.95); white-space:nowrap; }
    .cd__bud { display:flex; align-items:center; gap:5px; margin-left:auto; font-size:.74rem; color:rgba(150,180,220,.8); }
    .cd__bf { width:84px; border-radius:7px; padding:4px 8px; border:1px solid rgba(120,160,230,.3); background:rgba(18,26,42,.6); color:#fff; font-family:ui-monospace,monospace; font-size:.78rem; outline:none; text-align:right; }
    .cd__add { flex:0 0 auto; display:flex; gap:6px; padding:8px 11px; border-bottom:1px solid rgba(120,160,230,.1); flex-wrap:wrap; }
    .cd__in { border-radius:8px; padding:6px 10px; border:1px solid rgba(120,160,230,.25); background:rgba(18,26,42,.55); color:#fff; font-family:inherit; font-size:.82rem; outline:none; }
    .cd__name { flex:1; min-width:120px; } .cd__price { width:78px; text-align:right; font-family:ui-monospace,monospace; } .cd__url { flex:1; min-width:120px; }
    .cd__btn { cursor:pointer; padding:6px 12px; border-radius:8px; border:1px solid rgba(255,160,200,.4); background:rgba(110,40,70,.35); color:#fff; font-size:.78rem; }
    .cd__btn:hover { background:rgba(150,50,95,.45); }
    .cd__list { flex:1; min-height:0; overflow-y:auto; padding:8px 11px; }
    .cd__i { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px; margin-bottom:5px;
        border:1px solid rgba(120,160,230,.14); background:rgba(18,26,42,.45); }
    .cd__i.got { opacity:.55; } .cd__i.got .cd__in-n { text-decoration:line-through; }
    .cd__chk { cursor:pointer; width:17px; height:17px; flex:0 0 auto; }
    .cd__in-n { flex:1; font-weight:600; color:#fff; } .cd__i.afford .cd__in-n::before { content:'✓ '; color:rgba(120,220,160,.9); }
    .cd__in-p { font-family:'Share Tech Mono',ui-monospace,monospace; color:rgba(255,200,120,.95); }
    .cd__lnk { color:rgba(160,195,255,.85); text-decoration:none; } .cd__lnk:hover { color:#fff; }
    .cd__x { cursor:pointer; border:0; background:none; color:rgba(255,140,140,.7); font-size:.8rem; }
    .cd__foot { flex:0 0 auto; display:flex; gap:14px; flex-wrap:wrap; padding:7px 11px; border-top:1px solid rgba(120,160,230,.16);
        font-size:.72rem; font-family:ui-monospace,monospace; color:rgba(150,180,220,.7); }
    .cd__foot b { color:rgba(255,200,120,.95); } .cd__foot .ok { color:rgba(120,220,160,.95); }
    .cd__empty { margin:24px auto; text-align:center; color:rgba(190,212,228,.45); }
</style>
</head>
<body>
<div class="cd">
    <div class="cd__bar"><span class="cd__t">🎁 Cadeau</span>
        <label class="cd__bud">💰 budget <input class="cd__bf" type="number" min="0" data-bud placeholder="0"> .-</label></div>
    <div class="cd__add">
        <input class="cd__in cd__name" data-n placeholder="ce que tu veux…">
        <input class="cd__in cd__price" type="number" min="0" data-p placeholder="prix">
        <input class="cd__in cd__url" data-u placeholder="lien (optionnel)">
        <button class="cd__btn" data-add>+ envie</button></div>
    <div class="cd__list"></div>
    <div class="cd__foot"></div>
</div>
<script>
(function () {
    var KEY = 'xb:cadeau';
    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
    function load() { try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.items) return d; } catch (e) {} return { budget: 0, items: [] }; }
    function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
    function money(n) { return (Math.round(n * 100) / 100).toLocaleString('fr-CH') + ' .-'; }

    // --- bus xion same-origin (best-effort, jamais bloquant) ---
    var es = null;
    function emit(topic, payload) {
        try {
            fetch('/emit', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ topic: topic, payload: payload }) }).catch(function () {});
        } catch (e) {}
    }
    function connectBus() {
        try {
            es = new EventSource('/events');
            // on accueille les tsoins d'autres ploxions plus tard (ex. finance.solde) ;
            // pour l'instant on ne fait qu'écouter, sans muter l'état utilisateur.
            es.onerror = function () {};
        } catch (e) { es = null; }
    }

    var s = load();
    var root  = document.querySelector('.cd');
    var elBud = root.querySelector('[data-bud]'), elN = root.querySelector('[data-n]');
    var elP = root.querySelector('[data-p]'), elU = root.querySelector('[data-u]');
    var elList = root.querySelector('.cd__list'), elFoot = root.querySelector('.cd__foot');
    elBud.value = s.budget || '';

    var PRIO = ['☆ peut-être', '★ voulu', '★★ indispensable'];
    function render() {
        var wanted = s.items.filter(function (i) { return !i.bought; });
        // affordabilité PAR PRIORITÉ : on s'offre d'abord ce qu'on veut le plus
        // (prio décroissante, puis le moins cher), tant que le budget suit.
        var afford = {}, left = +s.budget || 0;
        wanted.slice().sort(function (a, b) { return (b.prio || 0) - (a.prio || 0) || a.price - b.price; })
            .forEach(function (i) { if (left >= i.price) { afford[i.id] = 1; left -= i.price; } });

        // tri d'affichage : priorité décroissante (les achetés en bas)
        var ordered = s.items.slice().sort(function (a, b) { return (a.bought ? 1 : 0) - (b.bought ? 1 : 0) || (b.prio || 0) - (a.prio || 0); });
        if (!s.items.length) { elList.innerHTML = '<div class="cd__empty">ajoute ce que t’as envie d’acheter ↑</div>'; }
        else elList.innerHTML = ordered.map(function (i) {
            var stars = (i.prio || 0) === 2 ? '★★' : (i.prio || 0) === 1 ? '★' : '☆';
            return '<div class="cd__i' + (i.bought ? ' got' : (afford[i.id] ? ' afford' : '')) + '" data-id="' + i.id + '">'
                 + '<input class="cd__chk" type="checkbox" data-got' + (i.bought ? ' checked' : '') + '>'
                 + '<button class="cd__x" data-prio title="' + PRIO[i.prio || 0] + '" style="color:rgba(255,205,110,.95);font-size:.86rem">' + stars + '</button>'
                 + '<span class="cd__in-n">' + (i.url ? '<a class="cd__lnk" href="' + esc(i.url) + '" target="_blank" rel="noopener">' + esc(i.name) + ' ↗</a>' : esc(i.name)) + '</span>'
                 + '<span class="cd__in-p">' + money(i.price) + '</span>'
                 + '<button class="cd__x" data-del title="retirer">✕</button></div>';
        }).join('');

        var totW = wanted.reduce(function (a, i) { return a + (+i.price || 0); }, 0);
        var totG = s.items.filter(function (i) { return i.bought; }).reduce(function (a, i) { return a + (+i.price || 0); }, 0);
        var nAff = Object.keys(afford).length, manque = totW - (+s.budget || 0);
        elFoot.innerHTML = 'à acheter <b>' + money(totW) + '</b> · acheté <span class="ok">' + money(totG) + '</span>'
            + ' · budget <b>' + money(+s.budget || 0) + '</b> → <span class="ok">' + nAff + '/' + wanted.length + '</span> payable' + (nAff > 1 ? 's' : '') + ' (reste ' + money(left) + ')'
            + (manque > 0 ? ' · <span style="color:rgba(255,150,150,.95)">manque ' + money(manque) + ' pour tout</span>' : (wanted.length ? ' · <span class="ok">tout payable ✓</span>' : ''));
    }
    function add() {
        var name = elN.value.trim(); if (!name) return;
        var it = { id: 'c' + Date.now().toString(36), name: name, price: +elP.value || 0, url: elU.value.trim(), bought: false, prio: 1 };
        s.items.push(it);
        save(s); elN.value = ''; elP.value = ''; elU.value = ''; render(); elN.focus();
        emit('cadeau.envie', { id: it.id, name: it.name, price: it.price, url: it.url }); // une envie = un tsoin sur le bus
    }

    root.querySelector('[data-add]').addEventListener('click', add);
    [elN, elP, elU].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); }); });
    elBud.addEventListener('input', function () { s.budget = +elBud.value || 0; save(s); render(); emit('cadeau.budget', { budget: s.budget }); });
    elList.addEventListener('click', function (e) {
        var row = e.target.closest('[data-id]'); if (!row) return; var id = row.getAttribute('data-id');
        if (e.target.closest('[data-del]')) { s.items = s.items.filter(function (i) { return i.id !== id; }); save(s); render(); emit('cadeau.retire', { id: id }); return; }
        if (e.target.closest('[data-prio]')) { var it = s.items.find(function (i) { return i.id === id; }); if (it) { it.prio = ((it.prio || 0) + 1) % 3; save(s); render(); } }
    });
    elList.addEventListener('change', function (e) {
        var c = e.target.closest('[data-got]'); if (!c) return; var id = c.closest('[data-id]').getAttribute('data-id');
        var it = s.items.find(function (i) { return i.id === id; }); if (it) { it.bought = c.checked; save(s); render(); emit('cadeau.achat', { id: it.id, name: it.name, price: it.price, bought: it.bought }); }
    });

    // --- droit au silence : on coupe le bus quand la page se retire ---
    function silence() {
        if (es) { try { es.close(); } catch (e) {} es = null; }
    }
    window.addEventListener('pagehide', silence);
    window.addEventListener('beforeunload', silence);

    connectBus();
    render();
})();
</script>
</body>
</html>
