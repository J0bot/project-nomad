<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>bouffe — commander à manger depuis le xer</title>
<!--
  PL0XI0N bouffe — version xerboxion-core autonome (sans Laravel).
  Launcher des services de livraison suisses (Uber Eats, Smood, Just Eat…) +
  tes spots favoris, ouverts en onglet (ces apps bloquent l'iframe). Favoris en
  localStorage (clé xb:bouffe:fav), au fur et à mesure. 100% client-side.
  La page EST le ploxion : rendu direct dans le body. Servie à /px/bouffe/index.html.
  Bus xion same-origin (/emit, /events). Droit au silence sur pagehide.
-->
<style>
  html, body { margin:0; height:100%; }
  body { background:#070a0f; }
  .bf { display:flex; flex-direction:column; min-height:100vh; box-sizing:border-box;
    background:#0a0805; color:rgba(238,232,220,.92);
    font-family:ui-sans-serif,system-ui,sans-serif; font-size:.84rem;
    -webkit-text-size-adjust:100%; }
  .bf__bar { flex:0 0 auto; display:flex; align-items:center; gap:7px;
    padding:8px 11px; border-bottom:1px solid rgba(230,160,80,.2);
    padding-top:calc(8px + env(safe-area-inset-top)); }
  .bf__t { font-weight:700; letter-spacing:.03em; color:rgba(255,180,90,.95); white-space:nowrap; }
  .bf__f { flex:1; border-radius:8px; padding:6px 11px; border:1px solid rgba(230,160,80,.25);
    background:rgba(30,22,14,.6); color:#fff; font-family:inherit; font-size:.82rem; outline:none; }
  .bf__f:focus { border-color:rgba(255,180,90,.55); }
  .bf__btn { cursor:pointer; padding:6px 12px; border-radius:8px; border:1px solid rgba(255,180,90,.45);
    background:rgba(120,70,20,.4); color:#fff; font-size:.78rem; white-space:nowrap; }
  .bf__btn:hover { background:rgba(170,100,30,.5); }
  .bf__body { flex:1; min-height:0; overflow-y:auto; padding:12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .bf__h { font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:rgba(220,180,130,.6); margin:4px 0 8px; }
  .bf__grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:9px; }
  .bf__card { cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px;
    border-radius:13px; border:1px solid rgba(230,160,80,.18); background:rgba(28,20,12,.55); color:inherit; text-align:center;
    transition:transform .08s, border-color .12s, background .12s; }
  .bf__card:hover { border-color:rgba(255,190,110,.7); background:rgba(46,32,18,.7); transform:translateY(-1px); }
  .bf__ic { font-size:1.8rem; line-height:1; }
  .bf__n { font-size:.74rem; color:rgba(245,235,220,.95); word-break:break-word; }
  .bf__rm { margin-top:2px; font-size:.6rem; color:rgba(255,150,120,.7); cursor:pointer; border:0; background:none; }
</style>
</head>
<body>
<div class="bf">
  <div class="bf__bar">
    <span class="bf__t">🍔 Bouffe</span>
    <input class="bf__f" placeholder="un resto, un plat, une URL…">
    <button class="bf__btn" data-go>commander ↗</button>
  </div>
  <div class="bf__body">
    <div class="bf__h">livraison</div>
    <div class="bf__grid" data-presets></div>
    <div class="bf__h" data-favh>tes spots</div>
    <div class="bf__grid" data-fav></div>
  </div>
</div>

<script>
(function () {
  var KEY = 'xb:bouffe:fav';

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  var PRESETS = [
    { ic:'🍔', n:'Uber Eats',    u:'https://www.ubereats.com' },
    { ic:'🛵', n:'Smood',        u:'https://www.smood.ch' },
    { ic:'🍽', n:'Just Eat',     u:'https://www.eat.ch' },
    { ic:'🥗', n:'Planet Bowl',  u:'https://www.google.com/search?q=planet+bowl+livraison' },
    { ic:'🍕', n:'Resto autour', u:'https://www.google.com/maps/search/restaurant+livraison' },
    { ic:'🛒', n:'Courses',      u:'https://www.coop.ch/fr/c/livraison' }
  ];

  function loadFav() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function saveFav(f) { try { localStorage.setItem(KEY, JSON.stringify(f.slice(0, 40))); } catch (e) {} }

  function normalize(u) {
    u = (u || '').trim(); if (!u) return null;
    if (!/^https?:\/\//i.test(u)) {
      u = /\.[a-z]{2,}($|\/|:)/i.test(u)
        ? 'https://' + u
        : 'https://www.google.com/search?q=' + encodeURIComponent(u + ' livraison');
    }
    return u;
  }

  // ── bus xion (same-origin : la page est servie à /px/bouffe/index.html) ──
  function emit(topic, payload) {
    try {
      fetch('/emit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic, payload: payload }) }).catch(function () {});
    } catch (e) {}
  }
  var es = null;
  try {
    es = new EventSource('/events');
    es.onerror = function () {}; // le bus peut être absent : on n'insiste pas
  } catch (e) { es = null; }

  // ── état + éléments ──
  var fav = loadFav();
  var elF    = document.querySelector('.bf__f'),
      elPre  = document.querySelector('[data-presets]'),
      elFav  = document.querySelector('[data-fav]'),
      elFavH = document.querySelector('[data-favh]'),
      elBody = document.querySelector('.bf__body');

  function openUrl(u, remember) {
    var url = normalize(u); if (!url) return;
    try { window.open(url, '_blank', 'noopener'); } catch (e) {}
    var host = url.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    emit('bouffe.commande', { url: url, host: host, remember: !!remember }); // l'envie de bouffe = un tsoin sur le bus
    if (remember) {
      fav = [{ ic:'🍴', n:host, u:url }].concat(fav.filter(function (f) { return f.u !== url; }));
      saveFav(fav); renderFav();
    }
  }

  function card(p, idx) {
    return '<div class="bf__card" data-u="' + esc(p.u) + '"><span class="bf__ic">' + esc(p.ic) + '</span>'
         + '<span class="bf__n">' + esc(p.n) + '</span>'
         + (idx != null ? '<button class="bf__rm" data-rm="' + idx + '">retirer</button>' : '') + '</div>';
  }

  function renderFav() {
    elFavH.style.display = fav.length ? '' : 'none';
    elFav.innerHTML = fav.map(function (f, i) { return card(f, i); }).join('');
  }

  elPre.innerHTML = PRESETS.map(function (p) { return card(p); }).join('');
  renderFav();

  document.querySelector('[data-go]').addEventListener('click', function () { openUrl(elF.value, true); elF.value = ''; });
  elF.addEventListener('keydown', function (e) { if (e.key === 'Enter') { openUrl(elF.value, true); elF.value = ''; } });
  elBody.addEventListener('click', function (e) {
    var rm = e.target.closest('[data-rm]');
    if (rm) { e.stopPropagation(); fav.splice(+rm.getAttribute('data-rm'), 1); saveFav(fav); renderFav(); return; }
    var c = e.target.closest('[data-u]');
    if (c) openUrl(c.getAttribute('data-u'), false);
  });

  // ── droit au silence : la page disparaît → on coupe le lien au bus ──
  function silence() { try { if (es) { es.close(); es = null; } } catch (e) {} }
  window.addEventListener('pagehide', silence);
  window.addEventListener('beforeunload', silence);
})();
</script>
</body>
</html>
